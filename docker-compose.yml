services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muzzie-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: muzzie-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: muzzie
      MYSQL_USER: muzzie
      MYSQL_PASSWORD: muzzie
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: muzzie-node
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: muzzie-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  mysql_data:
  composer_vendor:
  node_modules:

